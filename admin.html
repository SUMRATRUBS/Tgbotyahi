<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>AdCash BD - Admin Control Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-[#050914] text-white min-h-screen p-6">

  <!-- 🔒 PASSWORD WALL -->
  <div id="loginWall" class="fixed inset-0 bg-[#050914] z-50 flex items-center justify-center p-6">
    <div class="bg-gray-900 p-6 rounded-3xl border border-cyan-500/30 w-full max-w-sm text-center">
      <div class="w-14 h-14 rounded-full bg-cyan-500/20 mx-auto flex items-center justify-center text-cyan-400 text-2xl mb-3">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h3 class="text-base font-bold mb-4">অ্যাডমিন পাসওয়ার্ড দিন</h3>
      <input id="adminPassInput" type="password" placeholder="Password" class="w-full p-3 rounded-xl bg-gray-800 border border-gray-700 outline-none text-center font-bold mb-3" />
      <button onclick="checkAdminPassword()" class="w-full py-3 rounded-xl bg-cyan-500 font-bold text-black">লগইন</button>
    </div>
  </div>

  <!-- DASHBOARD CONTENT -->
  <div id="adminContent" class="max-w-6xl mx-auto space-y-6 hidden">
    <div class="flex justify-between items-center border-b border-gray-800 pb-4">
      <h1 class="text-xl font-black text-cyan-400"><i class="fa-solid fa-shield-halved mr-2"></i>AdCash Control Center</h1>
      <button onclick="location.reload()" class="text-xs bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-700">রিফ্রেশ</button>
    </div>

    <!-- PENDING SPIN DEPOSITS -->
    <div class="bg-gray-900 border border-yellow-500/30 rounded-2xl p-5">
      <h3 class="text-sm font-bold text-yellow-400 mb-3"><i class="fa-solid fa-coins mr-2"></i>পেন্ডিং স্পিন ডিপোজিট (Spin Balance)</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-xs text-left">
          <thead class="text-gray-400 border-b border-gray-800">
            <tr><th class="p-2">ইউজার</th><th class="p-2">টাকা</th><th class="p-2">TrxID</th><th class="p-2">অ্যাকশন</th></tr>
          </thead>
          <tbody id="spinDepositTable"></tbody>
        </table>
      </div>
    </div>

    <!-- PENDING GMAIL VERIFICATION -->
    <div class="bg-gray-900 border border-emerald-500/30 rounded-2xl p-5">
      <h3 class="text-sm font-bold text-emerald-400 mb-3"><i class="fa-solid fa-envelope mr-2"></i>জিমেইল সেল রিভিউ (Approve = ৳৮০)</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-xs text-left">
          <thead class="text-gray-400 border-b border-gray-800">
            <tr><th class="p-2">ইউজার</th><th class="p-2">জিমেইল</th><th class="p-2">পাসওয়ার্ড</th><th class="p-2">অ্যাকশন</th></tr>
          </thead>
          <tbody id="gmailTable"></tbody>
        </table>
      </div>
    </div>

    <!-- PENDING WITHDRAWALS -->
    <div class="bg-gray-900 border border-pink-500/30 rounded-2xl p-5">
      <h3 class="text-sm font-bold text-pink-400 mb-3"><i class="fa-solid fa-money-bill-wave mr-2"></i>বিকাশ/নগদ উইথড্র রিকোয়েস্ট</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-xs text-left">
          <thead class="text-gray-400 border-b border-gray-800">
            <tr><th class="p-2">ইউজার</th><th class="p-2">নাম্বার ও মেথড</th><th class="p-2">পরিমাণ</th><th class="p-2">অ্যাকশন</th></tr>
          </thead>
          <tbody id="withdrawTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
  apiKey: "AIzaSyAJi9UcEy-G8pv4gZw3j5PjdVzbtW9MPwk",
  authDomain: "client-91234.firebaseapp.com",
  projectId: "client-91234",
  storageBucket: "client-91234.firebasestorage.app",
  messagingSenderId: "347177227064",
  appId: "1:347177227064:web:d1216ad9b26f65766ee7cd"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Password Verification
    window.checkAdminPassword = () => {
      const pass = document.getElementById("adminPassInput").value;
      if(pass === "admin1234") { // 🔑 আপনার পছন্দমতো পাসওয়ার্ড দিন
        document.getElementById("loginWall").classList.add("hidden");
        document.getElementById("adminContent").classList.remove("hidden");
        loadData();
      } else {
        alert("ভুল পাসওয়ার্ড!");
      }
    };

    function loadData() {
      // Spin Deposits
      onSnapshot(collection(db, "spin_deposits"), (snap) => {
        const tbody = document.getElementById("spinDepositTable");
        tbody.innerHTML = "";
        snap.forEach(d => {
          const item = d.data();
          if(item.status === "Pending") {
            tbody.innerHTML += `
              <tr class="border-b border-gray-800">
                <td class="p-2">${item.user_name}</td>
                <td class="p-2 font-bold text-yellow-400">৳${item.amount}</td>
                <td class="p-2 font-mono text-cyan-400">${item.trx_id}</td>
                <td class="p-2">
                  <button onclick="approveDeposit('${d.id}', '${item.user_id}', ${item.amount})" class="px-3 py-1 bg-emerald-600 rounded font-bold">Approve</button>
                </td>
              </tr>`;
          }
        });
      });

      // Gmail Reviews
      onSnapshot(collection(db, "gmail_orders"), (snap) => {
        const tbody = document.getElementById("gmailTable");
        tbody.innerHTML = "";
        snap.forEach(d => {
          const item = d.data();
          if(item.status === "Pending") {
            tbody.innerHTML += `
              <tr class="border-b border-gray-800">
                <td class="p-2">${item.user_name}</td>
                <td class="p-2 text-cyan-300 font-mono">${item.email}</td>
                <td class="p-2 font-mono">${item.password}</td>
                <td class="p-2">
                  <button onclick="approveGmail('${d.id}', '${item.user_id}')" class="px-3 py-1 bg-emerald-600 rounded font-bold">Approve (৳৮০)</button>
                </td>
              </tr>`;
          }
        });
      });

      // Withdrawals
      onSnapshot(collection(db, "withdraws"), (snap) => {
        const tbody = document.getElementById("withdrawTable");
        tbody.innerHTML = "";
        snap.forEach(d => {
          const item = d.data();
          if(item.status === "Pending") {
            tbody.innerHTML += `
              <tr class="border-b border-gray-800">
                <td class="p-2">${item.user_name}</td>
                <td class="p-2">${item.method}: ${item.number}</td>
                <td class="p-2 font-bold text-pink-400">৳${item.amount}</td>
                <td class="p-2">
                  <button onclick="approveWithdraw('${d.id}')" class="px-3 py-1 bg-blue-600 rounded font-bold">Paid</button>
                </td>
              </tr>`;
          }
        });
      });
    }

    window.approveDeposit = async (depId, userId, amount) => {
      await updateDoc(doc(db, "spin_deposits", depId), { status: "Approved" });
      const userRef = doc(db, "users", String(userId));
      const userSnap = await getDoc(userRef);
      if(userSnap.exists()){
        const cur = userSnap.data().spin_balance || 0;
        await updateDoc(userRef, { spin_balance: cur + amount });
        alert("ডিপোজিট অ্যাপ্রুভ হয়েছে এবং ইউজারের স্পিন ব্যালেন্স যুক্ত হয়েছে!");
      }
    };

    window.approveGmail = async (orderId, userId) => {
      await updateDoc(doc(db, "gmail_orders", orderId), { status: "Approved" });
      const userRef = doc(db, "users", String(userId));
      const userSnap = await getDoc(userRef);
      if(userSnap.exists()){
        const cur = userSnap.data().balance || 0;
        await updateDoc(userRef, { balance: cur + 80 });
        alert("জিমেইল অ্যাপ্রুভড! ৳৮০ ইউজারের ওয়ালেটে যোগ হয়েছে।");
      }
    };

    window.approveWithdraw = async (wid) => {
      await updateDoc(doc(db, "withdraws", wid), { status: "Success" });
      alert("পেমেন্ট সম্পন্ন হিসেবে মার্ক করা হয়েছে!");
    };
  </script>
</body>
</html>
